<title>機械長さ検索</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 15px;
  font-family: Arial, "Noto Sans JP", sans-serif;
  background: #f3f4f6;
  color: #222;
}

.app {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin-top: 0;
  font-size: 26px;
}

.description {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
}

.search-box {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  font-size: 18px;
  border: 2px solid #ddd;
  border-radius: 10px;
  outline: none;
}

input:focus {
  border-color: #007aff;
}

button {
  padding: 0 20px;
  border: none;
  border-radius: 10px;
  background: #007aff;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

button:hover {
  background: #0066d6;
}

.result {
  margin-top: 20px;
  padding: 25px;
  text-align: center;
  background: #f8f9fa;
  border-radius: 14px;
  min-height: 130px;
}

.machine-name {
  font-size: 20px;
  color: #666;
}

.length {
  margin-top: 8px;
  font-size: 42px;
  font-weight: bold;
  color: #007aff;
}

.unit {
  font-size: 20px;
  color: #555;
}

.message {
  color: #777;
  padding-top: 20px;
}

.candidates {
  margin-top: 15px;
  border: 1px solid #ddd;
  border-radius: 10px;
  overflow: hidden;
}

.candidate {
  width: 100%;
  padding: 14px 16px;
  border-radius: 0;
  border-bottom: 1px solid #eee;
  background: white;
  color: #222;
  display: flex;
  justify-content: space-between;
  text-align: left;
}

.candidate:last-child {
  border-bottom: none;
}

.candidate:hover {
  background: #f0f6ff;
}

.count {
  margin-top: 15px;
  text-align: center;
  color: #888;
  font-size: 14px;
}
</style>
</head>

const searchBox = document.getElementById("search");
const result = document.getElementById("result");
const candidates = document.getElementById("candidates");
const count = document.getElementById("count");


function searchMachine() {

  const input = searchBox.value.trim();

  candidates.innerHTML = "";
  count.innerHTML = "";

  if (!input) {
    result.innerHTML =
      '<div class="message">機械名を入力してください</div>';
    return;
  }

  // 完全一致
  if (machines[input] !== undefined) {

    result.innerHTML = `
      <div class="machine-name">${input}</div>
      <div class="length">
        ${machines[input].toLocaleString()}
      </div>
      <div class="unit">mm</div>
    `;

    return;
  }

  // 大文字・小文字を無視した完全一致
  const exact = Object.keys(machines).find(
    name => name.toLowerCase() === input.toLowerCase()
  );

  if (exact) {

    result.innerHTML = `
      <div class="machine-name">${exact}</div>
      <div class="length">
        ${machines[exact].toLocaleString()}
      </div>
      <div class="unit">mm</div>
    `;

    return;
  }

  // 部分一致
  const results = Object.keys(machines).filter(
    name => name.toLowerCase().includes(input.toLowerCase())
  );

  if (results.length === 0) {

    result.innerHTML = `
      <div class="message">
        「${input}」は見つかりませんでした
      </div>
    `;

    return;
  }

  result.innerHTML = `
    <div class="message">
      候補が見つかりました
    </div>
  `;

  results.slice(0, 20).forEach(name => {

    const button = document.createElement("button");

    button.className = "candidate";

    button.innerHTML = `
      <span>${name}</span>
      <span>${machines[name].toLocaleString()} mm</span>
    `;

    button.onclick = function() {

      searchBox.value = name;

      result.innerHTML = `
        <div class="machine-name">${name}</div>
        <div class="length">
          ${machines[name].toLocaleString()}
        </div>
        <div class="unit">mm</div>
      `;

      candidates.innerHTML = "";
      count.innerHTML = "";

    };

    candidates.appendChild(button);

  });

  if (results.length > 20) {
    count.innerHTML =
      `候補 ${results.length} 件（最初の20件を表示）`;
  } else {
    count.innerHTML =
      `候補 ${results.length} 件`;
  }

}


// 入力するだけで自動検索
searchBox.addEventListener("input", searchMachine);


// Enterキーでも検索
searchBox.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    searchMachine();
  }

});
